id: f39b2744-755e-4275-af6d-9741b4f5c7ac
name: rpi-boot-config
description: >-
  Collect EEPROM bootloader settings, config.txt, and cmdline.txt from
  rpi-local, and assert two low-frequency sanity checks: BOOT_ORDER still
  contains every device the operator expects to be tried, and cmdline.txt
  still names a root= device. Boot configuration changes rarely, so this
  runs once a day rather than every 5 minutes like the telemetry
  extensions. It intentionally does not check EEPROM firmware
  current-vs-latest (that's @aaronge/rpi-health's readFirmware) or that
  cmdline's root= matches the filesystem host-health sees mounted at / —
  both are cross-model checks that belong in a future pre-migration-snapshot
  workflow, not duplicated here.
version: 1
tags: {}
trigger:
  schedule: "17 6 * * *"
inputs:
  properties:
    expectedBootOrderDevices:
      type: array
      default:
        - SD_CARD_BOOT
        - NVME_BOOT
        - USB_MSD_BOOT
        - RESTART
      description: >-
        Every device name that must appear somewhere in the decoded
        BOOT_ORDER. Defaults to this machine's pre-NVMe-migration order
        (0xf461). Update this input once the migration reorders BOOT_ORDER
        to put NVME_BOOT first — that's the point of asserting against an
        explicit expectation instead of "some order exists".
jobs:
  - name: collect
    description: Read EEPROM config, config.txt, and cmdline.txt in parallel.
    dependsOn: []
    steps:
      - name: readEeprom
        task:
          type: model_method
          modelIdOrName: rpi-local
          methodName: readEeprom
        dependsOn: []
      - name: readConfigTxt
        task:
          type: model_method
          modelIdOrName: rpi-local
          methodName: readConfigTxt
        dependsOn: []
      - name: readCmdline
        task:
          type: model_method
          modelIdOrName: rpi-local
          methodName: readCmdline
        dependsOn: []

  - name: assert
    description: Fail the run when a boot-configuration sanity check fails.
    dependsOn:
      - job: collect
        condition:
          type: completed
    steps:
      - name: boot-order-contains-expected
        allowFailure: false
        task:
          type: assert
          expr: >-
            inputs.expectedBootOrderDevices.all(d,
            d in data.latest("rpi-local", "eeprom").attributes.bootOrderDecoded)
          message: >-
            BOOT_ORDER ${{ data.latest("rpi-local", "eeprom").attributes.bootOrderRaw }}
            decodes to ${{ data.latest("rpi-local", "eeprom").attributes.bootOrderDecoded }},
            missing one of the expected devices ${{ inputs.expectedBootOrderDevices }} —
            a Pi that can't fall through to every expected boot device is one
            failed boot away from not coming back up.
          severity: high
        dependsOn: []
      - name: cmdline-root-present
        allowFailure: false
        task:
          type: assert
          expr: >-
            data.latest("rpi-local", "cmdline").attributes.rootParam != null
          message: >-
            cmdline.txt has no root= parameter — this is the exact field the
            NVMe migration rewrites, so its total absence is worth failing on
            rather than silently tolerating.
          severity: high
        dependsOn: []

  - name: report
    description: >-
      Print a one-screen summary. Depends on collect only (not assert), so
      it still runs when an assertion fails.
    dependsOn:
      - job: collect
        condition:
          type: completed
    steps:
      - name: summarize
        task:
          type: model_method
          modelType: "command/shell"
          modelName: rpi-boot-config-summary
          methodName: execute
          inputs:
            run: >-
              echo "rpi-boot-config: rpi-local" &&
              echo "  BOOT_ORDER: ${{ data.latest('rpi-local', 'eeprom').attributes.bootOrderRaw }} -> ${{ data.latest('rpi-local', 'eeprom').attributes.bootOrderDecoded }}" &&
              echo "  BOOT_UART=${{ data.latest('rpi-local', 'eeprom').attributes.bootUart }} POWER_OFF_ON_HALT=${{ data.latest('rpi-local', 'eeprom').attributes.powerOffOnHalt }} WAKE_ON_GPIO=${{ data.latest('rpi-local', 'eeprom').attributes.wakeOnGpio }} PSU_MAX_CURRENT=${{ data.latest('rpi-local', 'eeprom').attributes.psuMaxCurrentMa }}mA" &&
              echo "  config.txt sections: ${{ data.latest('rpi-local', 'configTxt').attributes.sections }}" &&
              echo "  cmdline root=: ${{ data.latest('rpi-local', 'cmdline').attributes.rootParam }}"
        dependsOn: []
